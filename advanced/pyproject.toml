[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchgpt"
version = "0.1.0"
description = "A language model you write yourself: tokenizer, transformer, training, evaluation."
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pyyaml", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
