# Smoke test: runs the whole pipeline end to end in under a minute, even on a CPU.
# Use it to check that everything is wired up. The loss it reaches means little.

# the model
vocab_size: 65
block_size: 32
n_layer: 2
n_head: 2
n_embd: 64
dropout: 0.0
causal: true
pos_emb: true

# training
batch_size: 16
learning_rate: 0.001
max_iters: 200
eval_interval: 50
eval_iters: 10
max_minutes: 9.0
seed: 1337
