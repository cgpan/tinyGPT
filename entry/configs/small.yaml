# A small, quick model for experiments: about a minute or two on a GPU.
# Good for trying one change at a time and comparing the loss.

# the model
vocab_size: 65
block_size: 64
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.0
causal: true
pos_emb: true

# training
batch_size: 32
learning_rate: 0.001
max_iters: 2000
eval_interval: 250
eval_iters: 20
max_minutes: 9.0
seed: 1337
